name: Cask checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cask-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      HOMEBREW_DEVELOPER: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check cask style
        run: brew style --cask Casks/*.rb

      - name: Validate cask metadata
        shell: bash
        run: |
          set -euo pipefail
          for cask in "$GITHUB_WORKSPACE"/Casks/*.rb; do
            brew info --json=v2 --cask "$cask" >/dev/null
          done
